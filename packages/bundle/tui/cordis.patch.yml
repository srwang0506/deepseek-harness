# The dsh-tui bundle patch: the Codex-style interactive terminal surface over
# dsh-base. It mounts no Host, HTTP server, Web runtime, or browser plugin. An
# ordinary provider plugin injects `cmdlineArgs`, parses this app's flags
# (the one-shot task positional, --resume, --continue, --model, and --help),
# then the terminal runner drives an Agent through the core registry, streams
# its events to the terminal, and answers approval/questions inline.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live while the terminal runs.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the other surfaces.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a terminal-surface component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    # Reads its invocation from the ordinary tuiStartup provider; an empty
    # `task` means interactive mode, an empty resume id means a fresh session.
    - id: tui-runner
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        task: !!js ctx.tuiStartup.task ?? ''
        resumeSessionId: !!js ctx.tuiStartup.resumeSessionId ?? ''
        continue: !!js ctx.tuiStartup.continue ?? false
        model: !!js ctx.tuiStartup.model ?? ''
        output: !!js ctx.tuiStartup.output ?? 'text'
