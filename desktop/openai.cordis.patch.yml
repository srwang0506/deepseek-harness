# Desktop distribution defaults: OpenAI Responses is the primary model route.
# The API key remains in DSH's credential store or the launching environment;
# this file contains references and protocol policy only.

- id: llm-deepseek
  disabled: true

# Finder-launched processes keep their physical cwd on APFS. DSH_CWD remains
# the single logical workspace for session metadata, filesystem resolution,
# and the shared sandbox boundary (important when the workspace is on exFAT).
- id: api-gateway
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- insert:
    # Desktop-only Codex integration. The official CLI owns account login and
    # app-server execution; Harness never copies or repurposes OAuth tokens.
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

- id: llm-pi-ai
  config:
    providers:
      openai:
        displayName: OpenAI
        apiKeyEnv: OPENAI_API_KEY
        reasoning: high
        cacheRetention: long
        transport: sse
        openAIResponses:
          store: true
          previousResponseId: true
          reasoningContext: all_turns
        modelOverrides:
          gpt-5.6-sol:
            contextWindow: 1050000

- id: agent-default-model
  config:
    provider: openai
    model: gpt-5.6-sol
