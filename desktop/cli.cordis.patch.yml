# The CLI shares the desktop provider and credential store but has no Web host.
# Its logical workspace is the invoking terminal's current directory unless
# DSH_CWD explicitly overrides it.

- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: llm-pi-ai
  config:
    credentialStorePath: !!js (process.env.DSH_HOME ?? process.cwd()) + '/pi-ai-auth.json'
    providers:
      openai-codex:
        displayName: OpenAI GPT
        reasoning: high
        cacheRetention: long
        transport: auto
        openAIResponses:
          store: true
          previousResponseId: true
          reasoningContext: all_turns
